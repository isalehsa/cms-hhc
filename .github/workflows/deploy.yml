# نشر تلقائي إلى Firebase (الاستضافة + قواعد Firestore + الدوال) عند كل تحديث
# يتطلب سراً واحداً في إعدادات المستودع باسم FIREBASE_SERVICE_ACCOUNT
# (مفتاح حساب الخدمة من: Firebase Console → Project settings → Service accounts → Generate new private key)
# وسراً اختيارياً ANTHROPIC_API_KEY لتفعيل التحليل التنظيمي بالذكاء الاصطناعي في الخادم
name: Deploy to Firebase

on:
  push:
    branches: [main, claude/merge-490frd, claude/regulatory-intelligence-integration-g2btgh]
  workflow_dispatch:

jobs:
  # فحوص الجودة قبل أي نشر: صياغة وحدات الواجهة + اختبارات الدوال والمنطق المشترك
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Syntax check (frontend ES modules)
        run: npm run check:syntax
      - name: Unit and integration tests
        run: npm run test:functions

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy hosting, Firestore rules and functions
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::السر FIREBASE_SERVICE_ACCOUNT غير مضبوط — تم تخطي النشر التلقائي (أضفه من Settings → Secrets and variables → Actions لتفعيله)"
            exit 0
          fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          FB="npx --yes firebase-tools@latest"

          # 1) سر مفتاح Claude الخادمي: يُخزَّن في Secret Manager ولا يظهر في المتصفح أبداً.
          #    عند غيابه تُضبط قيمة نائبة حتى ينجح نشر الدوال، ويعمل التحليل النصي المبدئي بدلاً منه.
          printf '%s' "${ANTHROPIC_API_KEY:-unset}" \
            | $FB functions:secrets:set ANTHROPIC_API_KEY --project cms-hhc --data-file - --force \
            || echo "::warning::تعذّر ضبط سر ANTHROPIC_API_KEY (يلزم دور Secret Manager Admin لحساب الخدمة) — قد يفشل نشر الدوال"

          # 2) الاستضافة وقواعد Firestore والفهارس — لا يجوز أن تفشل
          $FB deploy --only hosting,firestore --project cms-hhc --non-interactive --force

          # 3) الدوال (الفحص الأسبوعي والتقرير وواجهة الفحص اليدوي) — تتطلب خطة Blaze
          if $FB deploy --only functions --project cms-hhc --non-interactive --force; then
            echo "✓ نُشرت الدوال بنجاح (الفحص التنظيمي الأسبوعي والتقرير الأسبوعي مجدولان)"
          else
            echo "::warning::نُشرت الاستضافة والقواعد، لكن تعذّر نشر الدوال. الأسباب الشائعة: المشروع على خطة Spark (الدوال تتطلب Blaze)، أو نقص صلاحيات حساب الخدمة (يلزم Editor + Secret Manager Admin)، أو أن سر ANTHROPIC_API_KEY غير مضبوط. الوحدة تظل تعمل بالكامل من المتصفح (تسجيل يدوي + تحليل + اعتماد ودمج)، لكن الفحص الأسبوعي المجدول لن يعمل حتى ينجح نشر الدوال."
          fi
